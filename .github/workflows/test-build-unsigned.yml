name: Test Build (unsigned)

# Fork-only helper: build a Windows installer from any git ref without
# requiring TAURI_SIGNING_PRIVATE_KEY and without creating a GitHub Release.
# The installers are attached to the workflow run as downloadable artifacts.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '分支 / 标签 / 提交 SHA（留空则构建当前所选分支）'
        required: false
        type: string
        default: ''
      version:
        description: '覆盖构建版本号（需高于上游最新版本才不会被提示更新；留空则用仓库版本）'
        required: false
        type: string
        default: '1.33.0'
      retention_days:
        description: '构建产物保留天数'
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Resolve target ref
        id: target
        shell: bash
        run: |
          ref="${{ inputs.ref }}"
          if [ -z "$ref" ]; then
            ref="${{ github.ref }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building ref: $ref"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/app/src-tauri -> target'
          prefix-key: 'v0-rust-unsigned'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Override app version
        if: inputs.version != ''
        shell: bash
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $TARGET_VERSION (expected e.g. 1.33.0)" >&2
            exit 1
          fi
          sed -i -E "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$TARGET_VERSION\"/" packages/app/src-tauri/tauri.conf.json
          sed -i -E "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$TARGET_VERSION\"/" packages/app/package.json
          sed -i -E "0,/^version = \"[^\"]*\"/s//version = \"$TARGET_VERSION\"/" packages/app/src-tauri/Cargo.toml
          echo "--- patched versions ---"
          grep -n '"version"' packages/app/src-tauri/tauri.conf.json | head -1
          grep -n '"version"' packages/app/package.json | head -1
          grep -n '^version' packages/app/src-tauri/Cargo.toml | head -1

      - name: Disable updater artifacts (fork has no signing key)
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='packages/app/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          grep -n 'createUpdaterArtifacts' packages/app/src-tauri/tauri.conf.json

      - name: Build Tauri app
        env:
          VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
          VITE_GLITCHTIP_ENVIRONMENT: production
          GLITCHTIP_DSN_NATIVE: ${{ secrets.GLITCHTIP_DSN_NATIVE }}
          GLITCHTIP_ENVIRONMENT: production
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          VITE_APTABASE_KEY: ${{ secrets.VITE_APTABASE_KEY }}
        run: pnpm --filter app tauri:build

      - name: List bundle output
        shell: bash
        run: find packages/app/src-tauri/target/release/bundle -maxdepth 2 -type f | sort

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: onin-windows-unsigned-${{ github.run_number }}
          path: |
            packages/app/src-tauri/target/release/bundle/nsis/*.exe
            packages/app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
