name: Personal Build (unsigned)

# Fork-only workflow: build unsigned installers for all desktop platforms and
# publish them to a GitHub Release in this fork. No signing keys, no npm
# publishing, no updater metadata -- just downloadable installers.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '分支 / 标签 / 提交 SHA（留空则构建当前所选分支）'
        required: false
        type: string
        default: ''
      version:
        description: '覆盖构建版本号（需高于上游最新版本才不会被提示更新）'
        required: true
        type: string
        default: '1.33.0'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Create release tag
        id: meta
        shell: bash
        run: |
          tag="v${{ inputs.version }}-build.${{ github.run_number }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, reusing it."
          else
            git tag "$tag"
            git push origin "$tag"
            echo "Created tag $tag at $(git rev-parse --short HEAD)."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-latest
            target: ''
            args: ''
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libasound2-dev libdbus-1-dev patchelf pkg-config libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/app/src-tauri -> target'
          prefix-key: "v0-rust-unsigned-${{ matrix.target || 'default' }}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Override app version
        shell: bash
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const version = process.env.TARGET_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            console.error(`Invalid version: ${version} (expected e.g. 1.33.0)`);
            process.exit(1);
          }
          const patchJson = (file) => {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            data.version = version;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
          };
          patchJson("packages/app/src-tauri/tauri.conf.json");
          patchJson("packages/app/package.json");
          const cargoFile = "packages/app/src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoFile, "utf8");
          fs.writeFileSync(cargoFile, cargo.replace(/^version = "[^"]*"/m, `version = "${version}"`));
          console.log("patched version:", version);
          NODE

      - name: Disable updater artifacts (fork has no signing key)
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const file = "packages/app/src-tauri/tauri.conf.json";
          const data = JSON.parse(fs.readFileSync(file, "utf8"));
          data.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
          console.log("createUpdaterArtifacts =", data.bundle.createUpdaterArtifacts);
          NODE

      - name: Build inject script
        run: pnpm build:inject

      - name: Build Tauri app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
          VITE_GLITCHTIP_ENVIRONMENT: production
          GLITCHTIP_DSN_NATIVE: ${{ secrets.GLITCHTIP_DSN_NATIVE }}
          GLITCHTIP_ENVIRONMENT: production
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          VITE_APTABASE_KEY: ${{ secrets.VITE_APTABASE_KEY }}
        with:
          projectPath: packages/app
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Onin v${{ inputs.version }} personal build #${{ github.run_number }}'
          releaseBody: |
            个人测试构建（未签名、不含自动更新元数据），请勿用于正式分发。
            - 版本号：${{ inputs.version }}
            - 构建来源：${{ inputs.ref || github.ref }}
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}
